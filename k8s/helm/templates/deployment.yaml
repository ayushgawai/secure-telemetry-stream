apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-api}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: sts-api}}
  template:
    metadata: {labels: {app: sts-api}}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: 8080}, {containerPort: 50051}]
          env: [{name: REDIS_ADDR, value: {{ .Values.redisAddr | quote }}}]
